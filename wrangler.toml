name = "spotify-english-bot"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[triggers]
crons = ["0 17 * * *"]  # 5 PM UTC = 6 PM CET

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "spotify-english-bot"
database_id = "<your-database-id>"  # Run: npx wrangler d1 create spotify-english-bot